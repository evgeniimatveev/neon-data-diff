name: Findings

# Rebuilds the "Findings so far" block of the README from public GitHub data
# (the bot's sticky PR comments and the daily pipeline's runs). Commits only if it changed.

on:
  schedule:
    - cron: "17 4 * * *"   # GitHub may delay scheduled runs by hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: findings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the findings block
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_findings.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || { git commit -m "auto: findings block" && git push; }
