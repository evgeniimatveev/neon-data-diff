<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" role="img" aria-label="neon-data-diff: git diff for your dbt data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06100f"/>
      <stop offset="0.55" stop-color="#0a1a17"/>
      <stop offset="1" stop-color="#07090f"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0.2" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#00e599" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e599" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.8" r="0.5">
      <stop offset="0" stop-color="#ff4d6d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8fff6"/>
      <stop offset="1" stop-color="#00e599"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="card"><rect x="760" y="70" width="560" height="310" rx="18"/></clipPath>
  </defs>

  <rect width="1400" height="450" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="450" rx="22" fill="url(#glowG)"/>
  <rect width="1400" height="450" rx="22" fill="url(#glowR)"/>

  <!-- faint grid -->
  <g stroke="#00e599" stroke-opacity="0.05">
    <path d="M0 90H1400M0 180H1400M0 270H1400M0 360H1400"/>
    <path d="M140 0V450M280 0V450M420 0V450M560 0V450M700 0V450M840 0V450M980 0V450M1120 0V450M1260 0V450"/>
  </g>

  <!-- left: title block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="70" font-size="20" font-weight="600" fill="#00e599" letter-spacing="4">DBT  ·  NEON  ·  POSTGRES</text>
    <text x="68" y="170" font-size="82" font-weight="800" fill="url(#title)">neon-</text>
    <text x="68" y="252" font-size="82" font-weight="800" fill="url(#title)">data-diff</text>
    <text x="70" y="300" font-size="27" fill="#a8c7bd">git diff for your dbt data.</text>
    <text x="70" y="336" font-size="21" fill="#6f8f85">Tests say the data is valid. This says what changed.</text>
  </g>

  <!-- left bottom: pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="70" y="372" width="232" height="38" rx="19" fill="#00e599" fill-opacity="0.12" stroke="#00e599" stroke-opacity="0.6"/>
    <text x="186" y="397" text-anchor="middle" fill="#00e599">copy-on-write branch</text>
    <rect x="316" y="372" width="196" height="38" rx="19" fill="#00e599" fill-opacity="0.12" stroke="#00e599" stroke-opacity="0.6"/>
    <text x="414" y="397" text-anchor="middle" fill="#00e599">20 / 20 tests green</text>
  </g>

  <!-- right: diff card -->
  <rect x="760" y="70" width="560" height="310" rx="18" fill="#00e599" opacity="0.10" filter="url(#soft)"/>
  <rect x="760" y="70" width="560" height="310" rx="18" fill="#0b1513" fill-opacity="0.92" stroke="#00e599" stroke-opacity="0.45" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="760" y="70" width="560" height="44" fill="#00e599" fill-opacity="0.10"/>
  </g>
  <circle cx="788" cy="92" r="6" fill="#ff5f57"/>
  <circle cx="808" cy="92" r="6" fill="#febc2e"/>
  <circle cx="828" cy="92" r="6" fill="#28c840"/>
  <g font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace">
    <text x="852" y="97" font-size="15" fill="#7fa89c">PR #12  ·  Data diff  ·  base_marts vs head_marts</text>

    <text x="788" y="150" font-size="17" fill="#cfeee3">mart_monthly_trips</text>
    <text x="1292" y="150" font-size="16" fill="#00e599" text-anchor="end">27 → 26 rows</text>

    <rect x="780" y="170" width="520" height="34" rx="6" fill="#ff4d6d" fill-opacity="0.14"/>
    <text x="796" y="193" font-size="17" fill="#ff8aa1">-  2023-10   completed_trips   266   gross  5,289.65</text>
    <rect x="780" y="208" width="520" height="34" rx="6" fill="#00e599" fill-opacity="0.14"/>
    <text x="796" y="231" font-size="17" fill="#5ff0bb">+  2023-10   completed_trips   259   gross  5,120.21</text>

    <text x="788" y="282" font-size="15" fill="#6f8f85">13 of 27 months changed  ·  1 removed  ·  0 added</text>
    <text x="788" y="312" font-size="15" fill="#6f8f85">cause: request_date_la  Los Angeles → UTC</text>

    <rect x="788" y="334" width="240" height="30" rx="15" fill="#00e599" fill-opacity="0.16" stroke="#00e599" stroke-opacity="0.6"/>
    <text x="908" y="355" font-size="15" fill="#00e599" text-anchor="middle">tests passed, numbers moved</text>
  </g>
</svg>
